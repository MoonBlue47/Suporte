<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Técnico — SENAI Suporte</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="auth-logo">
        <i class="ph ph-wrench"></i>
      </a>
      <h2 class="auth-app-name">SENAI <span>Suporte</span></h2>
      <p class="auth-subtitle">Acesso restrito para técnicos e manutenção</p>
    </div>

    <div class="auth-body">
      <form id="formLogin" class="form-stack">
        <div class="form-group">
          <label class="form-label" for="email">E-mail Corporativo</label>
          <input type="email" id="email" class="form-control" placeholder="tecnico@sp.senai.br" required value="tecnico@sp.senai.br">
        </div>

        <div class="form-group">
          <label class="form-label" for="senha">Senha de Acesso</label>
          <input type="password" id="senha" class="form-control" placeholder="••••••••" required value="123456">
        </div>

        <button type="submit" class="btn btn-primary btn-full mt-2">
          <i class="ph ph-sign-in"></i> Entrar no Painel
        </button>
      </form>
    </div>

    <div class="auth-footer">
      <div>Ainda não tem conta? <a href="cadastro.html" class="fw-semibold">Cadastrar técnico</a></div>
      <div class="mt-2">
        <a href="index.html" class="text-muted" style="font-size: var(--text-xs);"><i class="ph ph-arrow-left"></i> Voltar ao início</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('formLogin');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const rawName = email.split('@')[0].replace('.', ' ');
        const formattedNome = rawName.charAt(0).toUpperCase() + rawName.slice(1);

        setCurrentUser({
          email: email,
          nome: formattedNome || 'Técnico SENAI'
        });

        showToast(`Bem-vindo, ${formattedNome}!`, 'success');
        setTimeout(() => {
          window.location.href = 'painel.html';
        }, 800);
      });
    });
  </script>
</body>
</html>
